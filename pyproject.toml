[project]
name = "maze-lab"
version = "0.1.0"
description = "Multi-agent maze exploration experiment"
authors = [
    { name = "Spencer Clark", email = "spenceclark@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "pydantic-ai-slim[anthropic,openai]>=2.57.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
maze-lab = "maze_lab.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.per-file-target-version]
"training/*.py" = "py312"  # runs in the separate Unsloth environment (Python 3.12)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pyright]
# defaults, plus what Unsloth training writes into the working directory
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "unsloth_compiled_cache", "outputs"]
