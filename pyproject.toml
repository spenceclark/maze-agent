[project]
name = "maze-lab"
version = "0.1.0"
description = "Multi-agent maze exploration experiment"
authors = [
    { name = "Spencer Clark", email = "spenceclark@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
maze-lab = "maze_lab.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
